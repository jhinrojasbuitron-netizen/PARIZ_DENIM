<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pariz Denim | Página no encontrada</title>
    <link rel="icon" type="image/JPG" href="imagen/Logo_Principal.JPG">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fef6f0 0%, #faf0ea 100%);
            text-align: center;
            padding: 20px;
        }
        .error-content {
            background: white;
            border-radius: 28px;
            padding: 60px 40px;
            box-shadow: 0 20px 40px rgba(74,44,44,0.06);
            border: 1px solid #f0dfda;
            max-width: 500px;
            width: 100%;
        }
        .error-icon {
            font-size: 80px;
            color: #e8a598;
            margin-bottom: 20px;
        }
        .error-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 72px;
            font-weight: 400;
            color: #4a2c2c;
            margin-bottom: 8px;
        }
        .error-content h2 {
            font-size: 22px;
            font-weight: 500;
            color: #4a2c2c;
            margin-bottom: 15px;
        }
        .error-content p {
            font-size: 15px;
            color: #b28b8b;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .error-btn {
            display: inline-block;
            padding: 14px 35px;
            background: #e8a598;
            color: white;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        .error-btn:hover {
            background: #d48c8c;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(232,165,152,0.35);
        }
        .error-btn i {
            margin-right: 8px;
        }
        .error-links {
            margin-top: 25px;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .error-link {
            color: #b28b8b;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s;
        }
        .error-link:hover {
            color: #e8a598;
        }
    </style>
</head>
<body>
    <section class="error-page">
        <div class="error-content">
            <div class="error-icon">
                <i class="fas fa-tshirt"></i>
            </div>
            <h1>404</h1>
            <h2>Página no encontrada</h2>
            <p>La página que buscas no existe o ha sido movida. Pero no te preocupes, tenemos muchas prendas hermosas para ti.</p>
            <a href="index.html" class="error-btn">
                <i class="fas fa-home"></i> Volver al inicio
            </a>
            <div class="error-links">
                <a href="productos.html" class="error-link">Productos</a>
                <a href="tiendas.html" class="error-link">Tiendas</a>
                <a href="contacto.html" class="error-link">Contacto</a>
                <a href="devoluciones.html" class="error-link">Devoluciones</a>
            </div>
        </div>
    </section>
</body>
</html>
